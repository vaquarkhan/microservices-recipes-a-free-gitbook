<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="figtitle">
  <title id="figtitle">Granularity cost curve</title>
  <defs>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#122833" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#122833" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowCopper" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#9a6b3f"/>
    </marker>
    <marker id="arrowDesk" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#1b3a4b"/>
    </marker>
    <marker id="arrowGood" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#2f6b55"/>
    </marker>
    <marker id="arrowBad" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#8b3a3a"/>
    </marker>
    <marker id="arrowSoft" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#3d5260"/>
    </marker>
    <marker id="arrowWarn" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#b8860b"/>
    </marker>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#f7f3eb"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#paperGrad)"/>
  <rect x="10" y="10" width="940" height="480" rx="18" fill="none" stroke="#ebe4d6" stroke-width="1"/>
  <text id="visible-title" x="28" y="38" fill="#1b3a4b" font-size="20" font-weight="650" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif">Granularity cost curve</text>
  <path d="M28 48 h360" stroke="#9a6b3f" stroke-width="1.2" stroke-linecap="round"/>
  <text x="28" y="66" fill="#3d5260" font-size="12" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif">A sketch of total cost, not a fitted chart from a production corpus.</text>
  <line x1="80" y1="400" x2="880" y2="400" stroke="#3d5260" stroke-width="1.2"/>
<line x1="80" y1="400" x2="80" y2="160" stroke="#3d5260" stroke-width="1.2"/>
<text x="68.0" y="280.0" fill="#3d5260" font-size="12" font-weight="500" text-anchor="end" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Total cost</text>
<text x="120.0" y="424.0" fill="#3d5260" font-size="12" font-weight="500" text-anchor="start" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >One coarse monolith</text>
<text x="480.0" y="424.0" fill="#2f6b55" font-size="12" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Calibrated middle</text>
<text x="840.0" y="424.0" fill="#3d5260" font-size="12" font-weight="500" text-anchor="end" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Many fine services</text>
<path d="M 100 360 C 240 370, 340 190, 480.0 190 S 720 370, 860 364" fill="none" stroke="#9a6b3f" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="480.0" cy="190" r="6" fill="#2f6b55"/>
<rect x="70.0" y="90.0" width="200.0" height="70.0" rx="10" fill="#f3e4e1" stroke="#8b3a3a" stroke-width="1.25" filter="url(#cardShadow)" />
<path d="M82.0 91.0 h176.0" stroke="#9a6b3f" stroke-width="1.15" stroke-linecap="round" opacity="0.85"/>
<text x="170.0" y="116.0" fill="#15252f" font-size="13" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Coarse end</text>
<text x="170.0" y="136.0" fill="#3d5260" font-size="11.5" font-weight="400" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >autonomy unavailable</text>
<rect x="380.0" y="70.0" width="200.0" height="70.0" rx="10" fill="#e7f0eb" stroke="#2f6b55" stroke-width="1.25" filter="url(#cardShadow)" />
<path d="M392.0 71.0 h176.0" stroke="#9a6b3f" stroke-width="1.15" stroke-linecap="round" opacity="0.85"/>
<text x="480.0" y="96.0" fill="#15252f" font-size="13" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Calibrated middle</text>
<text x="480.0" y="116.0" fill="#3d5260" font-size="11.5" font-weight="400" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >lowest total cost</text>
<rect x="690.0" y="90.0" width="200.0" height="70.0" rx="10" fill="#f3e4e1" stroke="#8b3a3a" stroke-width="1.25" filter="url(#cardShadow)" />
<path d="M702.0 91.0 h176.0" stroke="#9a6b3f" stroke-width="1.15" stroke-linecap="round" opacity="0.85"/>
<text x="790.0" y="116.0" fill="#15252f" font-size="13" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Fine end</text>
<text x="790.0" y="136.0" fill="#3d5260" font-size="11.5" font-weight="400" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >network + ops tax</text>
<text x="28.0" y="482.0" fill="#3d5260" font-size="11" font-weight="500" text-anchor="start" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="font-style:italic;" >Sketch of the shape the book argues for. Not a regression on an organic estate.</text>
</svg>
