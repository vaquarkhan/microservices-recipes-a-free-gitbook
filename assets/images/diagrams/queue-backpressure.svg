      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#8b3a3a"/>
    </marker>
    <marker id="arrowSoft" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#3d5260"/>
    </marker>
    <marker id="arrowWarn" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#b8860b"/>
    </marker>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#f7f3eb"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#paperGrad)"/>
  <rect x="10" y="10" width="940" height="360" rx="18" fill="none" stroke="#ebe4d6" stroke-width="1"/>
  <text id="visible-title" x="28" y="38" fill="#1b3a4b" font-size="20" font-weight="650" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif">Queue backpressure</text>
  <path d="M28 48 h360" stroke="#9a6b3f" stroke-width="1.2" stroke-linecap="round"/>
  <text x="28" y="66" fill="#3d5260" font-size="12" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif">A durable queue absorbs bursts. Depth and age tell the producer to slow down.</text>
  <rect x="40.0" y="150.0" width="170.0" height="86.0" rx="10" fill="#e4eef2" stroke="#1b3a4b" stroke-width="1.25" filter="url(#cardShadow)" />
