<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="figtitle">
  <title id="figtitle">Khan granularity matrix</title>
  <defs>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#122833" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#122833" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowCopper" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#9a6b3f"/>
    </marker>
    <marker id="arrowDesk" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#1b3a4b"/>
    </marker>
    <marker id="arrowGood" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#2f6b55"/>
    </marker>
    <marker id="arrowBad" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#8b3a3a"/>
    </marker>
    <marker id="arrowSoft" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#3d5260"/>
    </marker>
    <marker id="arrowWarn" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#b8860b"/>
    </marker>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#f7f3eb"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#paperGrad)"/>
  <rect x="10" y="10" width="960" height="500" rx="18" fill="none" stroke="#ebe4d6" stroke-width="1"/>
  <text id="visible-title" x="28" y="38" fill="#1b3a4b" font-size="20" font-weight="650" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif">Khan granularity matrix</text>
  <path d="M28 48 h360" stroke="#9a6b3f" stroke-width="1.2" stroke-linecap="round"/>
  <text x="28" y="66" fill="#3d5260" font-size="12" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif">Read the components. The zone names the problem and the fix.</text>
  <rect x="40.0" y="110.0" width="440.0" height="170.0" rx="10" fill="#e7f0eb" stroke="#2f6b55" stroke-width="1.25" filter="url(#cardShadow)" />
<path d="M52.0 111.0 h416.0" stroke="#9a6b3f" stroke-width="1.15" stroke-linecap="round" opacity="0.85"/>
<text x="260.0" y="136.0" fill="#15252f" font-size="13" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Healthy microservice</text>
<text x="260.0" y="156.0" fill="#3d5260" font-size="11.5" font-weight="400" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >High E, high S, manageable L</text>
<text x="260.0" y="171.0" fill="#3d5260" font-size="11.5" font-weight="400" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Leave it alone</text>
<rect x="500.0" y="110.0" width="440.0" height="170.0" rx="10" fill="#f6eed8" stroke="#b8860b" stroke-width="1.25" filter="url(#cardShadow)" />
<path d="M512.0 111.0 h416.0" stroke="#9a6b3f" stroke-width="1.15" stroke-linecap="round" opacity="0.85"/>
<text x="720.0" y="136.0" fill="#15252f" font-size="13" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Chatty boundary</text>
<text x="720.0" y="156.0" fill="#3d5260" font-size="11.5" font-weight="400" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Low E, good S and L</text>
<text x="720.0" y="171.0" fill="#3d5260" font-size="11.5" font-weight="400" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Cut hops or merge the chattiest edge</text>
<rect x="40.0" y="310.0" width="440.0" height="160.0" rx="10" fill="#f3e4e1" stroke="#8b3a3a" stroke-width="1.25" filter="url(#cardShadow)" />
<path d="M52.0 311.0 h416.0" stroke="#9a6b3f" stroke-width="1.15" stroke-linecap="round" opacity="0.85"/>
<text x="260.0" y="336.0" fill="#15252f" font-size="13" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Distributed-monolith fragment</text>
<text x="260.0" y="356.0" fill="#3d5260" font-size="11.5" font-weight="400" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Good E, low S</text>
<text x="260.0" y="371.0" fill="#3d5260" font-size="11.5" font-weight="400" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Merge, or find the missed seam</text>
<rect x="500.0" y="310.0" width="440.0" height="160.0" rx="10" fill="#f4ecdc" stroke="#c4a574" stroke-width="1.25" filter="url(#cardShadow)" />
<path d="M512.0 311.0 h416.0" stroke="#9a6b3f" stroke-width="1.15" stroke-linecap="round" opacity="0.85"/>
<text x="720.0" y="336.0" fill="#15252f" font-size="13" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Ownership problem</text>
<text x="720.0" y="356.0" fill="#3d5260" font-size="11.5" font-weight="400" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >High L, whatever else is true</text>
<text x="720.0" y="371.0" fill="#3d5260" font-size="11.5" font-weight="400" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Shrink the surface or change the owner</text>
</svg>
