<text x="28.0" y="522.0" fill="#3d5260" font-size="11" font-weight="500" text-anchor="start" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="font-style:italic;" >Bands: &lt;0.4 coarse/monolith · 0.4–0.7 at-risk · &gt;0.7 healthy.</text>
