<text x="28.0" y="442.0" fill="#3d5260" font-size="11" font-weight="500" text-anchor="start" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="font-style:italic;" >Disjoint means three systems with partially independent owners, not three vaults the team cannot touch.</text>
