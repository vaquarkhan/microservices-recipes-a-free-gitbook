<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="figtitle">
  <title id="figtitle">Where the money goes</title>
  <defs>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#122833" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#122833" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowCopper" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#9a6b3f"/>
    </marker>
    <marker id="arrowDesk" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#1b3a4b"/>
    </marker>
    <marker id="arrowGood" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#2f6b55"/>
    </marker>
    <marker id="arrowBad" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#8b3a3a"/>
    </marker>
    <marker id="arrowSoft" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#3d5260"/>
    </marker>
    <marker id="arrowWarn" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#b8860b"/>
    </marker>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#f7f3eb"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#paperGrad)"/>
  <rect x="10" y="10" width="900" height="440" rx="18" fill="none" stroke="#ebe4d6" stroke-width="1"/>
  <text id="visible-title" x="28" y="38" fill="#1b3a4b" font-size="20" font-weight="650" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif">Where the money goes</text>
  <path d="M28 48 h360" stroke="#9a6b3f" stroke-width="1.2" stroke-linecap="round"/>
  <text x="28" y="66" fill="#3d5260" font-size="12" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif">Wasted time is the shaded overhead on the critical path, times how often it runs.</text>
  <rect x="40.0" y="110.0" width="400.0" height="280.0" rx="14" fill="#e7f0eb" stroke="#2f6b55" stroke-width="1"  />
<text x="56.0" y="132.0" fill="#9a6b3f" font-size="11" font-weight="600" text-anchor="start" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >In process</text>
<rect x="80.0" y="180.0" width="320.0" height="48.0" rx="8" fill="#2f6b55" stroke="#2f6b55" stroke-width="1"  />
<text x="240.0" y="210.0" fill="#fffaf2" font-size="14" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Useful work</text>
<text x="240.0" y="260.0" fill="#3d5260" font-size="12" font-weight="500" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Efficiency near one</text>
<text x="240.0" y="280.0" fill="#3d5260" font-size="12" font-weight="500" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >wasted time near zero</text>
<rect x="480.0" y="110.0" width="400.0" height="280.0" rx="14" fill="#f3e4e1" stroke="#8b3a3a" stroke-width="1"  />
<text x="496.0" y="132.0" fill="#9a6b3f" font-size="11" font-weight="600" text-anchor="start" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Badly drawn boundary</text>
<rect x="520.0" y="180.0" width="140.0" height="48.0" rx="8" fill="#2f6b55" stroke="#2f6b55" stroke-width="1"  />
<text x="590.0" y="210.0" fill="#fffaf2" font-size="13" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Useful</text>
<rect x="668.0" y="180.0" width="176.0" height="48.0" rx="8" fill="#8b3a3a" stroke="#8b3a3a" stroke-width="1"  />
<text x="756.0" y="210.0" fill="#fffaf2" font-size="13" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Network tax</text>
<text x="680.0" y="260.0" fill="#3d5260" font-size="12" font-weight="500" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Serialization, transmission, waiting</text>
<text x="680.0" y="280.0" fill="#15252f" font-size="12" font-weight="600" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" style="" >W = N × t_total × (1 − E)</text>
<text x="28.0" y="442.0" fill="#3d5260" font-size="11" font-weight="500" text-anchor="start" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="font-style:italic;" >The picture is wall-clock on the path. Whether it is an invoice line depends on how you are billed.</text>
</svg>
