<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img" aria-labelledby="figtitle">
  <title id="figtitle">Metastable retry loop</title>
  <defs>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#122833" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#122833" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowCopper" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#9a6b3f"/>
    </marker>
    <marker id="arrowDesk" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#1b3a4b"/>
    </marker>
    <marker id="arrowGood" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#2f6b55"/>
    </marker>
    <marker id="arrowBad" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#8b3a3a"/>
    </marker>
    <marker id="arrowSoft" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#3d5260"/>
    </marker>
    <marker id="arrowWarn" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto">
      <path d="M1 1.2 L6.4 4 L1 6.8 Z" fill="#b8860b"/>
    </marker>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#f7f3eb"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#paperGrad)"/>
  <rect x="10" y="10" width="960" height="380" rx="18" fill="none" stroke="#ebe4d6" stroke-width="1"/>
  <text id="visible-title" x="28" y="38" fill="#1b3a4b" font-size="20" font-weight="650" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif">Metastable retry loop</text>
  <path d="M28 48 h360" stroke="#9a6b3f" stroke-width="1.2" stroke-linecap="round"/>
  <text x="28" y="66" fill="#3d5260" font-size="12" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif">The trigger can be gone and the system still stays collapsed.</text>
  <rect x="40.0" y="150.0" width="150.0" height="86.0" rx="10" fill="#f6eed8" stroke="#b8860b" stroke-width="1.25" filter="url(#cardShadow)" />
<path d="M52.0 151.0 h126.0" stroke="#9a6b3f" stroke-width="1.15" stroke-linecap="round" opacity="0.85"/>
<text x="115.0" y="176.0" fill="#15252f" font-size="13" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Brief trigger</text>
<rect x="250.0" y="150.0" width="170.0" height="86.0" rx="10" fill="#f3e4e1" stroke="#8b3a3a" stroke-width="1.25" filter="url(#cardShadow)" />
<path d="M262.0 151.0 h146.0" stroke="#9a6b3f" stroke-width="1.15" stroke-linecap="round" opacity="0.85"/>
<text x="335.0" y="176.0" fill="#15252f" font-size="13" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Dependency slows</text>
<rect x="480.0" y="150.0" width="190.0" height="86.0" rx="10" fill="#f4ecdc" stroke="#c4a574" stroke-width="1.25" filter="url(#cardShadow)" />
<path d="M492.0 151.0 h166.0" stroke="#9a6b3f" stroke-width="1.15" stroke-linecap="round" opacity="0.85"/>
<text x="575.0" y="176.0" fill="#15252f" font-size="13" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Callers wait</text>
<text x="575.0" y="196.0" fill="#3d5260" font-size="11.5" font-weight="400" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >and hold threads</text>
<rect x="730.0" y="150.0" width="190.0" height="86.0" rx="10" fill="#f3e4e1" stroke="#8b3a3a" stroke-width="1.25" filter="url(#cardShadow)" />
<path d="M742.0 151.0 h166.0" stroke="#9a6b3f" stroke-width="1.15" stroke-linecap="round" opacity="0.85"/>
<text x="825.0" y="176.0" fill="#15252f" font-size="13" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Retries add load</text>
<rect x="360.0" y="300.0" width="280.0" height="64.0" rx="10" fill="#f3e4e1" stroke="#8b3a3a" stroke-width="1.25" filter="url(#cardShadow)" />
<path d="M372.0 301.0 h256.0" stroke="#9a6b3f" stroke-width="1.15" stroke-linecap="round" opacity="0.85"/>
<text x="500.0" y="326.0" fill="#15252f" font-size="13" font-weight="600" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif" style="" >Trigger is gone · system stays collapsed</text>
<line x1="192.0" y1="193.0" x2="242.0" y2="193.0" stroke="#9a6b3f" stroke-width="1.35"  marker-end="url(#arrowCopper)" stroke-linecap="round"/>
<line x1="422.0" y1="193.0" x2="472.0" y2="193.0" stroke="#9a6b3f" stroke-width="1.35"  marker-end="url(#arrowCopper)" stroke-linecap="round"/>
<line x1="672.0" y1="193.0" x2="722.0" y2="193.0" stroke="#9a6b3f" stroke-width="1.35"  marker-end="url(#arrowCopper)" stroke-linecap="round"/>
<line x1="823.0" y1="150.0" x2="343.0" y2="150.0" stroke="#8b3a3a" stroke-width="1.35" stroke-dasharray="5 4" marker-end="url(#arrowBad)" stroke-linecap="round"/>
<line x1="116.9" y1="236.7" x2="352.6" y2="329.1" stroke="#9a6b3f" stroke-width="1.35" stroke-dasharray="5 4" marker-end="url(#arrowCopper)" stroke-linecap="round"/>
</svg>
